services:
  minio:
    image: pgsty/silo:latest
    container_name: lakehouse-minio
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    volumes: ["q16-minio-data:/data"]
  postgres:
    image: postgres:17
    container_name: lakehouse-pg
    environment:
      POSTGRES_PASSWORD: postgres
    volumes: ["q16-pg-data:/var/lib/postgresql/data"]
  migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    profiles: ["tools"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: This-is-NOT-Secure!
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:postgres@postgres:5432/postgres
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:postgres@postgres:5432/postgres
    command: migrate
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    container_name: lakekeeper
    environment: *lakekeeper-env
    ports: ["127.0.0.1:8181:8181"]
    command: serve
  trino:
    image: trinodb/trino:476
    container_name: trino
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./catalog:/etc/trino/catalog:ro"]
volumes:
  q16-minio-data:
  q16-pg-data:
